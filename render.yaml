services:
  - type: web
    name: finova-open
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATA_SOURCE
        value: mock
      - key: DATA_BACKEND
        value: mock
      - key: NEXT_PUBLIC_DATA_SOURCE
        value: mock
      - key: MODEL_PROVIDER
        value: mock
      - key: GEMINI_ENABLED
        value: "false"
